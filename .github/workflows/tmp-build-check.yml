name: Storefront build check

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Validate contact-only ordering model
        shell: bash
        run: |
          set -euo pipefail
          test ! -e 'src/app/(web)/dat-hang/page.tsx'
          test ! -e 'src/app/api/order/route.ts'
          test -e 'src/app/api/leads/route.ts'

          if grep -RIn \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
            --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='*.test.js' --exclude='*.test.jsx' \
            '/dat-hang' src next.config.js; then
            echo 'Found stale /dat-hang reference'
            exit 1
          fi

          if grep -REn \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
            --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='*.test.js' --exclude='*.test.jsx' \
            'useCartStore|CartContext|addToCart|cart-storage|label: .Giỏ hàng.' src; then
            echo 'Found stale cart state or cart navigation'
            exit 1
          fi

          grep -q 'Đặt qua Zalo' 'src/app/(web)/components/ProductCard.tsx'
          grep -q 'Đặt qua Zalo' 'src/app/(web)/components/ProductOrderActions.tsx'
          grep -q 'Nhắn Fanpage' 'src/app/(web)/components/ProductOrderActions.tsx'
          grep -q 'formatPrice' 'src/app/(web)/components/ProductCard.tsx'
          grep -q 'formatUnitPrice' 'src/app/(web)/components/ProductCard.tsx'
          grep -q 'formatPrice' 'src/app/(web)/components/ProductOrderActions.tsx'
          grep -q 'formatUnitPrice' 'src/app/(web)/components/ProductOrderActions.tsx'

      - name: Validate age gate and lead capture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Bạn đã đủ 18 tuổi chưa?' 'src/app/(web)/components/AgeVerificationGate.tsx'
          grep -q 'Tôi đã đủ 18 tuổi' 'src/app/(web)/components/AgeVerificationGate.tsx'
          grep -q 'Chưa đủ 18 tuổi' 'src/app/(web)/components/AgeVerificationGate.tsx'
          grep -q "POLICY_VERSION = '3.0'" 'src/constants/compliance.ts'
          ! grep -q 'AGE_GATE_PREPAINT_SCRIPT' 'src/app/(web)/layout.tsx'
          ! grep -q 'visibility:hidden' 'src/app/(web)/layout.tsx'
          grep -q 'SHEETS_WEBHOOK_URL' 'src/app/api/leads/route.ts'
          grep -q 'lead_form_submit' 'src/lib/leadClient.ts'
          grep -q 'contact_zalo_click' 'src/lib/leadClient.ts'
          grep -q 'contact_phone_click' 'src/lib/leadClient.ts'
          grep -q 'FooterLeadForm' 'src/app/(web)/components/WebFooter.tsx'

      - name: Validate public B2B copy
        shell: bash
        run: |
          set -euo pipefail
          files=(
            'src/app/(web)/bang-gia-si-dai-ly/page.tsx'
            'src/app/(web)/bia-duc-cho-nha-hang-khach-san/page.tsx'
          )
          if grep -Ein 'chiết[[:space:]]*khấu|giá[[:space:]]*sỉ|B2B[[:space:]]*(price|giá)|[0-9]{1,3}[[:space:]]*%' "${files[@]}"; then
            echo 'Public B2B commercial terms must stay private'
            exit 1
          fi
          grep -q 'sanitizePublicCommercialCopy' 'src/lib/data/articles.ts'

      - name: Run tests
        run: npm test

      - name: Build Next.js
        run: npx next build
