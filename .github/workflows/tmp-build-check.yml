name: Temporary production build check

on:
  pull_request:
    branches:
      - ci/build-base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Report metadata and transactional phrase candidates
        shell: bash
        run: |
          set -u
          echo '=== METADATA LINES ==='
          grep -RInE --include='*.ts' --include='*.tsx' 'title:|description:|openGraph:' src/app || true
          echo '=== TRANSACTIONAL / SALES PHRASE CANDIDATES ==='
          grep -RInEi --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.json' 'mua bia|đặt hàng|giao hàng toàn quốc|giao toàn quốc|mua ngay|thêm vào giỏ|giỏ hàng|checkout|mã giảm giá|coupon|\bCOD\b|đăng nhập|đăng ký|thanh toán|đơn hàng|còn hàng|hết hàng' src || true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Validate online-ordering removal
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' '/dat-hang' src; then
            echo 'Found stale /dat-hang reference in src'
            exit 1
          fi
          if grep -REn --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' 'useCartStore|cart-storage' src; then
            echo 'Found stale cart state reference in src'
            exit 1
          fi
          if grep -n 'Mua Ngay' 'src/app/(web)/components/ProductCard.tsx'; then
            echo 'ProductCard still contains Mua Ngay'
            exit 1
          fi
          grep -q 'Xem chi tiết' 'src/app/(web)/components/ProductCard.tsx'
          grep -q "repeat(3, minmax(0, 1fr))" 'src/app/(web)/components/MobileBottomNav.tsx'
          test ! -e 'src/app/(web)/dat-hang/page.tsx'
          test ! -e 'src/app/api/order/route.ts'
          test -e 'src/app/(web)/lien-he/page.tsx'
          test -e 'src/app/(web)/san-pham/[slug]/page.tsx'
      - name: Validate brochure product catalog and detail
        shell: bash
        run: |
          set -euo pipefail
          catalog='src/app/(web)/san-pham/page.tsx'
          detail='src/app/(web)/san-pham/[slug]/page.tsx'
          card='src/app/(web)/components/ProductCard.tsx'
          actions='src/app/(web)/components/ProductOrderActions.tsx'
          form='src/app/(web)/components/ProductConsultationForm.tsx'
          grep -q 'Website giới thiệu sản phẩm. Để đặt hàng, vui lòng liên hệ hotline 0899.191.313 hoặc Zalo.' "$catalog"
          for label in 'Benediktiner' 'Bitburger' 'Combo' 'Rượu vang Đức' 'Xúc xích' 'Phụ kiện'; do grep -q "$label" "$catalog"; done
          grep -q 'showReferencePriceNote={true}' "$catalog"
          grep -q 'aria-label={`Xem chi tiết ${name}`}' "$card"
          grep -q 'Giá tham khảo — vui lòng liên hệ để được báo giá và đặt hàng.' "$card"
          grep -q "const isAlcohol = product.category === 'bia' || product.category === 'vang' || isCombo" "$detail"
          grep -q 'Sản phẩm chỉ dành cho người từ đủ 18 tuổi.' "$detail"
          if grep -q 'price: product.price' "$detail"; then echo 'Product detail still passes price into Product JSON-LD'; exit 1; fi
          if grep -En 'Mua ngay|Mua Ngay|Thêm vào giỏ|Còn hàng|Hết hàng|mã giảm giá|Mã giảm giá' "$detail" "$actions"; then echo 'Product detail still contains transactional UI copy'; exit 1; fi
          grep -q 'Quan tâm sản phẩm này?' "$actions"
          test -e "$form"
      - name: Validate age declaration gate
        shell: bash
        run: |
          set -euo pipefail
          gate='src/app/(web)/components/AgeVerificationGate.tsx'
          util='src/utils/ageVerification.ts'
          layout='src/app/(web)/layout.tsx'
          constants='src/constants/compliance.ts'
          grep -q 'Họ và tên' "$gate"
          grep -q 'type="date"' "$gate"
          grep -q 'validateFullName' "$gate"
          grep -q 'Rất tiếc, nội dung này chỉ dành cho người từ đủ 18 tuổi.' "$gate"
          grep -q 'target="_blank"' "$gate"
          grep -q "event.key === 'Escape'" "$gate"
          grep -q "setAttribute('inert'" "$gate"
          grep -q 'AGE_VERIFICATION_EXPIRY_DAYS' "$util"
          grep -q 'Max-Age=' "$util"
          grep -q 'isSearchCrawlerUserAgent' "$util"
          grep -q 'googlebot' "$util"
          grep -q 'bingbot' "$util"
          if grep -En 'localStorage\.(getItem|setItem|removeItem)' "$util"; then echo 'Age verification still stores/reads status in localStorage'; exit 1; fi
          grep -q 'AGE_VERIFICATION_EXPIRY_DAYS = 30' "$constants"
          grep -q "POLICY_VERSION = '2.0'" "$constants"
          grep -q 'AGE_GATE_PREPAINT_SCRIPT' "$layout"
          grep -q 'googlebot' "$layout"
          grep -q 'bingbot' "$layout"
          grep -q 'data-age-gate' "$layout"
      - name: Validate policy restructuring
        shell: bash
        run: |
          set -euo pipefail
          terms='src/app/(web)/dieu-khoan-su-dung/page.tsx'
          info='src/app/(web)/thong-tin-mua-hang/page.tsx'
          footer='src/app/(web)/components/WebFooter.tsx'
          sitemap='src/app/sitemap.ts'
          grep -q 'Tính chất của website' "$terms"
          grep -q 'không thực hiện chức năng đặt hàng trực tuyến' "$terms"
          test -e "$info"
          grep -q 'Thông Tin Mua Hàng' "$info"
          grep -q 'không phải điều khoản giao dịch trực tuyến' "$info"
          grep -q 'Thông tin mua hàng' "$footer"
          grep -q '/thong-tin-mua-hang' "$footer"
          test ! -e 'src/app/(web)/chinh-sach-giao-hang/page.tsx'
          test ! -e 'src/app/(web)/chinh-sach-thanh-toan/page.tsx'
          test ! -e 'src/app/(web)/chinh-sach-doi-tra/page.tsx'
          grep -q "'thong-tin-mua-hang'" "$sitemap"
          if grep -Eq "'chinh-sach-(giao-hang|thanh-toan|doi-tra)'" "$sitemap"; then echo 'Legacy policy URL still present in sitemap'; exit 1; fi
      - name: Run compliance unit tests
        run: npx vitest run src/lib/compliance/compliance.test.ts
      - name: Build Next.js
        run: npx next build
      - name: Smoke-check affected routes and redirects
        shell: bash
        run: |
          set -euo pipefail
          npx next start -p 3000 > /tmp/next.log 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid} 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/next.log; exit 1; fi
          for path in / /san-pham /kien-thuc /lien-he /thong-tin-mua-hang /dieu-khoan-su-dung /chinh-sach-bao-mat /chinh-sach-cookie /chinh-sach-kiem-soat-do-tuoi /san-pham/bitburger-premium-pils-thung-12-chai-330ml; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000${path}")
            test "$code" = "200" || { echo "Broken route ${path}: HTTP ${code}"; exit 1; }
          done
          check_redirect() {
            source_path="$1"; expected_location="$2"
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000${source_path}")
            test "$code" = "301" || { echo "Expected 301 for ${source_path}, got ${code}"; exit 1; }
            location=$(curl -sSI "http://127.0.0.1:3000${source_path}" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^location:/ {print $2; exit}')
            case "$location" in "$expected_location"|"http://127.0.0.1:3000${expected_location}"|"http://localhost:3000${expected_location}") ;; *) echo "Unexpected redirect ${source_path} -> ${location}"; exit 1 ;; esac
          }
          check_redirect /dat-hang /lien-he
          check_redirect /chinh-sach-giao-hang /thong-tin-mua-hang
          check_redirect /chinh-sach-thanh-toan /thong-tin-mua-hang
          check_redirect /chinh-sach-doi-tra /thong-tin-mua-hang
