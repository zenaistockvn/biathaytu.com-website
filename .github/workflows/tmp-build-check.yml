name: Temporary production build check

on:
  pull_request:
    branches:
      - ci/build-base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build Next.js
        run: npx next build
