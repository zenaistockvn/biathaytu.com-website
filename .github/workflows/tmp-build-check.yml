name: Temporary production build check

on:
  pull_request:
    branches:
      - ci/build-base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Validate online-ordering removal
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' '/dat-hang' src; then
            echo 'Found stale /dat-hang reference in src'
            exit 1
          fi
          if grep -REn --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' 'useCartStore|cart-storage' src; then
            echo 'Found stale cart state reference in src'
            exit 1
          fi
          if grep -n 'Mua Ngay' 'src/app/(web)/components/ProductCard.tsx'; then
            echo 'ProductCard still contains Mua Ngay'
            exit 1
          fi
          grep -q 'Xem chi tiết' 'src/app/(web)/components/ProductCard.tsx'
          grep -q "repeat(3, minmax(0, 1fr))" 'src/app/(web)/components/MobileBottomNav.tsx'
          test ! -e 'src/app/(web)/dat-hang/page.tsx'
          test ! -e 'src/app/api/order/route.ts'
          test -e 'src/app/(web)/lien-he/page.tsx'
          test -e 'src/app/(web)/san-pham/[slug]/page.tsx'
      - name: Build Next.js
        run: npx next build
      - name: Smoke-check affected routes and redirect
        shell: bash
        run: |
          set -euo pipefail
          npx next start -p 3000 > /tmp/next.log 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid} 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/next.log
            exit 1
          fi
          for path in / /san-pham /kien-thuc /lien-he /san-pham/bitburger-premium-pils-thung-12-chai-330ml; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000${path}")
            test "$code" = "200" || { echo "Broken route ${path}: HTTP ${code}"; exit 1; }
          done
          redirect_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dat-hang)
          test "$redirect_code" = "301" || { echo "Expected 301 for /dat-hang, got ${redirect_code}"; exit 1; }
          location=$(curl -sSI http://127.0.0.1:3000/dat-hang | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^location:/ {print $2; exit}')
          case "$location" in
            /lien-he|http://127.0.0.1:3000/lien-he|http://localhost:3000/lien-he) ;;
            *) echo "Unexpected redirect location: ${location}"; exit 1 ;;
          esac
